[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "magicreels"
version = "0.2.0"
description = "A reproducible Traditional Chinese article-to-reel production toolkit"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["Pillow>=10,<13", "numpy>=1.24,<3"]

[project.urls]
Repository = "https://github.com/billtoutw/MagicReels"
Issues = "https://github.com/billtoutw/MagicReels/issues"

[project.optional-dependencies]
align = ["faster-whisper>=1.1,<2"]

[project.scripts]
magicreels = "magicreels.cli:main"

[tool.setuptools]
packages = ["magicreels"]
